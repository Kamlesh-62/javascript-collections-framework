name: Feature request
description: A collection, operation or option the package does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a program cannot do, or can do only awkwardly, today.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: The call as it would be written, with its result.
      render: ts
    validations:
      required: true
  - type: textarea
    id: native
    attributes:
      label: Native counterpart
      description: The closest operation of Array, Map, Set or a JavaScript proposal, if there is one.
    validations:
      required: false
