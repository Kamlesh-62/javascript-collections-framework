# Weekly, grouped, with a cooldown: a new release must be at least a week old before it is
# proposed (security updates bypass the cooldown). Pull requests are reviewed, never auto-merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dev-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 has no compiler API until 7.1; the build and the source-rule tests need it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
