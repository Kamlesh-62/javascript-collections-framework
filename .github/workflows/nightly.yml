name: Nightly

# Slow checks that do not need to block pull requests: the framework recipes run against the real
# React, Vue and Svelte packages in fixtures/frameworks/, which installs on its own; the dependency
# audit of the browser and bundler fixtures in fixtures/bundlers/; and the stress suites, against
# the source and against the built package.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  frameworks:
    name: Framework recipes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the framework apps
        working-directory: fixtures/frameworks
        run: pnpm install --frozen-lockfile
      - name: Run the framework apps
        working-directory: fixtures/frameworks
        run: pnpm test
      - name: Audit the framework apps' dependencies
        working-directory: fixtures/frameworks
        run: pnpm audit

  bundlers-audit:
    name: Audit the browser and bundler fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit the browser and bundler fixtures' dependencies
        working-directory: fixtures/bundlers
        run: pnpm audit

  stress:
    name: Stress suites (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Stops a hung run; the suites' counts are fixed, so time is never a pass condition.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [src, esm, cjs, copies]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the stress suites
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm test:stress --project "$PROJECT"
