# Supply-chain hardening for installs. See SECURITY.md.
minimumReleaseAge: 4320 # minutes (3 days): never install a version younger than this
minimumReleaseAgeExclude: [] # only for an urgent security patch, then remove
trustPolicy: no-downgrade # refuse a version with weaker provenance than its predecessor
blockExoticSubdeps: true # no git or tarball dependencies anywhere in the tree
strictDepBuilds: true # an install script not listed below fails the install
allowBuilds: {}
saveExact: true

# Audit exceptions. Each entry names the advisory, why it cannot reach the published package, and
# when to remove it. Never add one for a runtime path (there are no runtime dependencies).
auditConfig:
  ignoreGhsas:
    # picomatch <= 4.0.7, ReDoS with repeated extglobs; no patched release yet (2026-11-17).
    # Reached only through development tools (changesets, globbing in test and build tooling);
    # `pnpm list --prod` has no path to it. Remove once a fixed picomatch is released.
    - GHSA-fc5q-39xc-vjpf
    # minimatch 7.0.0 - 11.0.0, denial of service via globparts amplification (2026-11-19).
    # Reached only through typedoc (API reference site), which depends on minimatch ^10.2.5; its
    # patterns come from this repository's own config. Remove once typedoc depends on minimatch >= 11.
    - GHSA-g3hv-75wg-m249
